# SPDX-License-Identifier: ODbL-1.0
kind: rig
schema_version: 0
id: rig.texas

names:
  canonical: Texas rig
  aliases: [T-rig, Texas rigged worm]

nodes:
  - {id: main, type: line, role: main-line, material: braid, breaking_load_kg: 13.6}
  - {id: sinker, ref: weight.bullet, mass_g: 7.0}
  - {id: hook, ref: hook.offset-worm, gap_mm: 14}
  - {id: bait, ref: bait.stick-worm, length_mm: 125}

edges:
  # The weight rides free on the main line and is stopped by the hook itself.
  # There is no bead and no swivel, which is the whole difference from a Carolina.
  - from: main
    to: sinker
    rel: threaded
    travel: {toward_rod: open, toward_terminal: hook}

  - {from: main, to: hook, rel: tied, knot: knot.palomar, pin: eye}
  - {from: hook, to: bait, rel: rigged, rigging: rigging.texposed}

failure_modes:
  - Weight not stopped, which cannot happen here because the hook knot is the stop, but does happen when a swivel is added without a bead and the knot is tied above it.
  - Bait rigged crooked, which spins the whole presentation. See rigging.texposed stage 4.
  - Bullet bore too small for the line, which frays the main line where it rides.

validation:
  status: unvalidated
  events: []
